name: petmate
description: "PetMate — an AI-powered smart pet care companion. CMP 7003 Emerging Mobile Applications, PRAC1."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Firebase: auth, cloud database, media storage ---
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6

  # --- State management ---
  provider: ^6.1.5+1

  # --- AI transport + prompt fingerprinting ---
  http: ^1.6.0
  crypto: ^3.0.7

  # --- Formatting ---
  intl: ^0.20.3

  # --- Local care reminders ---
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # --- Multimedia (LO2): pet photos from camera or gallery ---
  image_picker: ^1.2.3

  # --- Analytics charts ---
  fl_chart: ^1.2.0
  table_calendar: ^3.2.1

  # --- Geolocation and mapping (LO2) ---
  # flutter_map renders OpenStreetMap tiles, which needs no billing account or
  # API key — unlike the Google Maps SDK — and works on a bare emulator.
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # --- Local persistence and connectivity awareness ---
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
