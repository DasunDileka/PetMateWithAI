# Lowered from -Xmx8G / -XX:MaxMetaspaceSize=4G so the Gradle daemon leaves
# room for Android Studio + the emulator on a laptop. Raise again if you have
# 32 GB+ and Gradle ever reports OutOfMemoryError.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
